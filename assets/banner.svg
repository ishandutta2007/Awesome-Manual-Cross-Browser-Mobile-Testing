<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for subtle drop shadow and glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Subtle Floating / Pulsing Dynamic Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes shimmerWave {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #38bdf8; }
    }

    .card-float-1 {
      animation: floatSlow 5s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatDelayed 6s ease-in-out infinite;
    }
    .card-float-3 {
      animation: floatSlow 7s ease-in-out infinite reverse;
    }
    .orb-anim {
      transform-origin: center;
      animation: pulseOrb 8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Circuit / Matrix Grid -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4 8" />
    <line x1="500" y1="0" x2="500" y2="360" stroke-dasharray="4 8" />
    <line x1="700" y1="0" x2="700" y2="360" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4 8" />
    <line x1="1100" y1="0" x2="1100" y2="360" stroke-dasharray="4 8" />
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Glowing Background Orbs (Behind content) -->
  <circle class="orb-anim" cx="150" cy="80" r="140" fill="url(#cyanBlue)" filter="url(#glow)" />
  <circle class="orb-anim" cx="1050" cy="280" r="160" fill="url(#purplePink)" filter="url(#glow)" />
  <circle class="orb-anim" cx="600" cy="340" r="120" fill="url(#emeraldTeal)" filter="url(#glow)" opacity="0.3" />

  <!-- Animated Interactive / Testing Devices Showcase (Right Flank / Background) -->
  <g transform="translate(850, 45)">
    <!-- Floating Device Card 1: Real Mobile Device Cloud -->
    <g class="card-float-1" filter="url(#cardShadow)">
      <rect x="0" y="0" width="270" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="37" r="16" fill="#0284c7" fill-opacity="0.3" />
      <text x="28" y="42" text-anchor="middle" font-size="16">📱</text>
      <text class="card-label" x="54" y="28" fill="#38bdf8">Real Mobile Device Lab</text>
      <text class="badge-text" x="54" y="49" fill="#f8fafc">Android &amp; iOS Physical Cloud</text>
      <circle cx="248" cy="24" r="4" fill="#10b981" />
    </g>

    <!-- Floating Device Card 2: Interactive Desktop Browsers -->
    <g class="card-float-2" filter="url(#cardShadow)">
      <rect x="20" y="94" width="270" height="74" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="48" cy="131" r="16" fill="#4f46e5" fill-opacity="0.3" />
      <text x="48" y="136" text-anchor="middle" font-size="16">🌐</text>
      <text class="card-label" x="74" y="122" fill="#818cf8">Cross-Browser Engine</text>
      <text class="badge-text" x="74" y="143" fill="#f8fafc">Chrome • Safari • Firefox • Edge</text>
      <circle cx="268" cy="118" r="4" fill="#38bdf8" />
    </g>

    <!-- Floating Device Card 3: Live DevTools &amp; Telemetry -->
    <g class="card-float-3" filter="url(#cardShadow)">
      <rect x="-10" y="188" width="270" height="74" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="18" cy="225" r="16" fill="#db2777" fill-opacity="0.3" />
      <text x="18" y="230" text-anchor="middle" font-size="16">⚡</text>
      <text class="card-label" x="44" y="216" fill="#ec4899">Real-Time Inspection</text>
      <text class="badge-text" x="44" y="237" fill="#f8fafc">Remote ADB • Web Inspector • Logs</text>
      <circle cx="238" cy="212" r="4" fill="#ec4899" />
    </g>
  </g>

  <!-- Main Foreground Content (Remains high contrast & clean) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text class="badge-text" x="28" y="20" fill="#38bdf8">CURATED QA &amp; TESTING STACK</text>

    <!-- Main Title with Gradient Stroke Accent -->
    <text class="title" x="0" y="75">
      Manual Cross-Browser &amp;
    </text>
    <text class="title" x="0" y="125" fill="url(#primaryGlow)">
      Mobile Testing Cloud
    </text>

    <!-- Subtitle & Description -->
    <text class="subtitle" x="0" y="165">
      Comprehensive Directory of Real Device Clouds, Interactive Testing SaaS &amp; Open-Source Farms
    </text>

    <!-- Feature Tags / Capabilities Row -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" class="badge-text">⚡ Interactive SaaS</text>

      <!-- Tag 2 -->
      <rect x="172" y="0" width="175" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="186" y="21" class="badge-text">🔓 Open-Source Farms</text>

      <!-- Tag 3 -->
      <rect x="359" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="373" y="21" class="badge-text">📱 Real Device Labs</text>

      <!-- Tag 4 -->
      <rect x="541" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="555" y="21" class="badge-text">🔍 Live Exploratory</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGlow)" />
</svg>
